{{ range . }}
<a href="{{ .Page.RelPermalink }}" class="s12 m4 l3 block">
	<article class="no-padding medium-height border content-card">
		<img class="responsive small" src="{{ .Page.Params.thumbnail }}" alt="Thumbnail for '{{ .Page.Title }}'" />
		<div class="padding">
			<h5 class="small">{{ .Page.Title }}</h5>

			<p>
				<i class="prefix-icon">today</i>
				<span>{{ .Page.Date.Format "2006-01-02" }}</span>
			</p>

			<p>
				<i class="prefix-icon">description</i>
				<span>
					{{ with .Page.Description }}
						{{ . | strings.Truncate 80 "..." }}
					{{ else }}
						<em>No description given</em>
					{{ end }}
				</span>
			</p>
		</div>
	</article>
</a>
{{ end }}
