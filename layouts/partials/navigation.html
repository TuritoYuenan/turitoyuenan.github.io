{{ $currentPage := . }}
<nav aria-label="Bottom Navigation Bar" class="s bottom">
	{{ range $i, $e := site.Menus.main }}
	<a class='{{ if $currentPage.IsMenuCurrent "main" . }}active{{ end }}' href="{{ .URL }}" title="{{ .Name }}"
		aria-label="Go to {{ .Name }} page">
		<i>{{ .Params.symbol }}</i>
		<span>{{ .Name }}</span>
	</a>
	{{ end }}
</nav>

<nav aria-label="Top Navigation Bar" class="m l top" id="navrail">
	<a href="/"><img class="responsive" src="/favicon.svg" alt="Wordmark"></a>
	<h6 class="small">{{ .Site.Title }}</h6>

	<div class="max"></div>

	{{ range site.Menus.main }}
	<a class='{{ if $currentPage.IsMenuCurrent "main" . }}active{{ end }}' href="{{ .URL }}" title="{{ .Name }}"
		aria-label="Go to {{ .Name }} page">
		<i>{{ .Params.symbol }}</i>
		<span>{{ .Name }}</span>
	</a>
	{{ end }}
</nav>
