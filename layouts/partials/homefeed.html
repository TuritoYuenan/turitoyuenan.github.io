{{ range . }}
<article class="no-padding small-width medium-height border">
	<img class="responsive small" src="{{ .Page.Params.thumbnail }}" alt="Thumbnail for '{{ .Page.Title }}'" />
	<div class="padding">
		<nav class="wrap">
			<span class="chip">
				<i>today</i>
				{{ .Page.Date.Format "2006-01-02" }}
			</span>
		</nav>
		<h5 class="small">{{ .Page.Title }}</h5>
		<p>{{ .Page.Description }}</p>
		<nav aria-label="Button Bar">
			<a class="button" href="{{ .Page.RelPermalink }}" aria-label="Read: {{ .Page.Title }}">View</a>
		</nav>
	</div>
</article>
{{ end }}
