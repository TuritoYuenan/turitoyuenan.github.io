{{ define "header" }}
<header class="responsive">
	<nav aria-label="Button Bar">
		<button class="circle transparent" id="back" aria-label="Go back">
			<i>arrow_back</i>
		</button>

		<div class="max"></div>

		<button class="circle transparent" aria-label="Share this page"
			onclick="sharePage(document.title, window.location.href)">
			<i>share</i>
		</button>
	</nav>

	<div class="small-padding">
		<h1 class="small">{{ .Title }}</h1>
		<p>Published on {{ .Date.Format "02 January 2006" }}</p>
		<p>{{ .Description }}</p>
	</div>
</header>
{{ end }}

{{ define "main" }}
<section>
	<img class="responsive round" src="{{ .Params.thumbnail }}" alt="">
</section>

<article>
	{{ .Content }}
</article>
{{ end }}
